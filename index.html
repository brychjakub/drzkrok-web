<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drž krok | Osobní nástěnka</title>
  <meta name="description" content="Ultra jednoduchá osobní nástěnka pro rychlé zorientování: teď, později, hotovo." />
  <meta name="theme-color" content="#f6f2ea" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <header class="hero" aria-labelledby="page-title">
      <p class="eyebrow">drzkrok.cz</p>
      <h1 id="page-title">Drž krok</h1>
      <p class="subtitle">Osobní nástěnka. Ne plánovač.</p>
    </header>

    <div id="message" class="message" role="status" aria-live="polite">Načítám nástěnku…</div>

    <section class="board" aria-label="Osobní nástěnka">
      <section class="column" aria-labelledby="now-title">
        <div class="column-head">
          <h2 id="now-title">Teď</h2>
          <span class="column-note">co je v hlavě</span>
        </div>
        <div id="now-list" class="card-list" data-state="now"></div>
      </section>

      <section class="column" aria-labelledby="later-title">
        <div class="column-head">
          <h2 id="later-title">Později</h2>
          <span class="column-note">nechat spát</span>
        </div>
        <div id="later-list" class="card-list" data-state="later"></div>
      </section>

      <section class="column" aria-labelledby="done-title">
        <div class="column-head">
          <h2 id="done-title">Hotovo</h2>
          <span class="column-note">neotevírat z nudy</span>
        </div>
        <div id="done-list" class="card-list" data-state="done"></div>
      </section>
    </section>
  </main>

  <footer class="footer">Méně systému. Více jasno.</footer>

  <script src="script.js" defer></script>
</body>
</html>
