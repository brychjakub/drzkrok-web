<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drž krok | Projektový dashboard</title>
  <meta name="description" content="Rychlý osobní dashboard pro jeden aktivní projekt, mapu, odkazy, screenshoty a archiv starších projektů." />
  <meta name="theme-color" content="#f6f2ea" />
  <link rel="stylesheet" href="style.css?v=20260612-1" />
</head>
<body>
  <main class="page-shell">
    <div id="message" class="message" role="status" aria-live="polite">Načítám projekt…</div>

    <section id="project-overview" class="project-overview" aria-label="Přehled aktivního projektu"></section>

    <section class="board" aria-label="Projektová nástěnka">
      <section class="column" aria-labelledby="now-title">
        <div class="column-head">
          <h2 id="now-title">Teď</h2>
        </div>
        <div id="now-list" class="card-list" data-state="now"></div>
      </section>

      <section class="column" aria-labelledby="later-title">
        <div class="column-head">
          <h2 id="later-title">Později</h2>
        </div>
        <div id="later-list" class="card-list" data-state="later"></div>
      </section>

      <section class="column" aria-labelledby="done-title">
        <div class="column-head">
          <h2 id="done-title">Hotovo</h2>
        </div>
        <div id="done-list" class="card-list" data-state="done"></div>
      </section>
    </section>

    <section id="archive" class="archive" aria-label="Archiv projektů"></section>
  </main>


  <script src="config.js"></script>
  <script src="script.js?v=20260612-1" defer></script>
</body>
</html>
